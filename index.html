<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Shop — PayMongo Checkout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>🛒 My Shop</h1>
        <button class="cart-btn" id="cartBtn">🛒 Cart (<span id="cartCount">0</span>)</button>
    </header>

    <main>
        <h2>Our Products</h2>
        <div class="products-grid" id="productsGrid"></div>
    </main>

    <!-- Cart & Billing Modal -->
    <div class="modal" id="cartModal">
        <div class="modal-content">
            <span class="close" id="closeModal">&times;</span>
            <h2>🛍️ Checkout</h2>
            
            <div id="cartItems"></div>
            <div class="cart-total">
                <strong>Total: ₱<span id="cartTotal">0.00</span></strong>
            </div>

            <h3>📋 Billing Details</h3>
            <div class="billing-form">
                <input type="text" id="fullName" placeholder="Full Name" required>
                <input type="email" id="email" placeholder="Email Address" required>
                <input type="tel" id="phone" placeholder="Phone Number" required>
                <input type="text" id="address" placeholder="Shipping Address (Optional)">
            </div>

            <button class="pay-btn" id="payBtn">💳 Pay with PayMongo</button>
            <p class="secure-note">🔒 Secure payment powered by PayMongo</p>
        </div>
    </div>

    <!-- Loading -->
    <div class="loading" id="loading">
        <div class="spinner"></div>
        <p>Creating secure payment link...</p>
    </div>

    <!-- Toast Messages -->
    <div class="toast" id="toast"></div>

    <script src="products.js"></script>
    <script src="app.js"></script>
</body>
</html>
