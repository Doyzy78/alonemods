<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Successful ✅</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif;}
        body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f0fdf4;padding:2rem;}
        .card{background:white;padding:3rem 2rem;border-radius:16px;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,0.05);max-width:420px;width:100%;}
        .icon{font-size:4rem;margin-bottom:1rem;}
        h1{color:#16a34a;margin-bottom:0.5rem;}
        p{color:#64748b;margin-bottom:1.5rem;line-height:1.6;}
        .order-id{background:#f0fdf4;color:#16a34a;padding:0.5rem 1rem;border-radius:6px;font-weight:600;margin-bottom:1.5rem;display:inline-block;}
        .btn{background:#16a34a;color:white;border:none;padding:0.8rem 2rem;border-radius:8px;font-size:1rem;cursor:pointer;text-decoration:none;display:inline-block;}
        .btn:hover{background:#15803d;}
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">✅</div>
        <h1>Payment Successful!</h1>
        <p>Thank you for your purchase. Your payment has been confirmed.</p>
        <div class="order-id" id="orderId">Order: —</div>
        <br>
        <a href="index.html" class="btn">Continue Shopping</a>
    </div>
    <script>
        const params = new URLSearchParams(window.location.search);
        const orderId = params.get('order_id') || 'N/A';
        document.getElementById('orderId').textContent = 'Order: ' + orderId;
    </script>
</body>
</html>
